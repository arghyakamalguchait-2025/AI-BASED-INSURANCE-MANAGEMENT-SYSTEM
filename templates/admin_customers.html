{% extends 'base.html' %}
{% block title %}Customers | Admin{% endblock %}
{% block content %}
<section class="py-5">
  <div class="container">
    <h2 class="fw-bold mb-4">Customers</h2>
    <div class="table-responsive">
      <table class="table table-hover shadow-sm">
        <thead class="table-light">
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Role</th>
          </tr>
        </thead>
        <tbody>
          {% for user in customers %}
          <tr>
            <td>{{ user.full_name }}</td>
            <td>{{ user.email }}</td>
            <td>{{ user.phone }}</td>
            <td>{{ user.role }}</td>
          </tr>
          {% else %}
          <tr><td colspan="4" class="text-center text-secondary">No customers found.</td></tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</section>
{% endblock %}
