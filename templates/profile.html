{% extends 'base.html' %}
{% block title %}Profile | InsureWise AI{% endblock %}
{% block content %}
<section class="py-5 bg-light">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="card shadow-sm border-0">
          <div class="card-body p-4">
            <h2 class="fw-bold mb-4">My Profile</h2>
            <form method="post">
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label">Full Name</label>
                  <input type="text" class="form-control" name="full_name" value="{{ user.full_name }}">
                </div>
                <div class="col-md-6">
                  <label class="form-label">Email</label>
                  <input type="email" class="form-control" value="{{ user.email }}" disabled>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Phone</label>
                  <input type="tel" class="form-control" name="phone" value="{{ user.phone }}">
                </div>
                <div class="col-md-6">
                  <label class="form-label">Date of Birth</label>
                  <input type="date" class="form-control" value="{{ user.date_of_birth }}" disabled>
                </div>
                <div class="col-md-4">
                  <label class="form-label">Address</label>
                  <input type="text" class="form-control" name="address" value="{{ customer.address if customer else '' }}">
                </div>
                <div class="col-md-4">
                  <label class="form-label">City</label>
                  <input type="text" class="form-control" name="city" value="{{ customer.city if customer else '' }}">
                </div>
                <div class="col-md-4">
                  <label class="form-label">State</label>
                  <input type="text" class="form-control" name="state" value="{{ customer.state if customer else '' }}">
                </div>
              </div>
              <button type="submit" class="btn btn-primary mt-4">Update Profile</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
